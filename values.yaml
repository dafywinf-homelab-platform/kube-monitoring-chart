kube-monitoring-stack:
  grafana:
    enabled: true
    # Admin login comes from Secret grafana-admin, created by the sealed-secrets controller from
    # homelab-gitops apps/platform/monitoring/kube-monitoring-extras/grafana-admin.sealedsecret.yaml
    # (`make seal-grafana-admin` there). Never put the password in this public repo.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts: []
      tls:
        - hosts: []

  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - []
      tls:
        - hosts:
            - []

  alertmanager:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - []
      tls:
        - hosts:
            - []

